<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" role="img" aria-labelledby="title desc">
<title id="title">Grouped holdout ranking metrics</title>
<desc id="desc">Week 4 rule and logistic regression on identical held-out pages. Base rate 0.322.</desc>
<rect width="820" height="420" fill="#fffefa"/>
<text x="30" y="40" font-family="Arial,sans-serif" font-size="21" font-weight="700">Ranking results on the same client holdout</text>
<text x="30" y="65" font-family="Arial,sans-serif" font-size="13">4,113 pages · 8 held-out clients · positive rate 0.322</text>
<text x="30" y="112" font-family="Arial,sans-serif" font-size="15" font-weight="700">Precision@20</text>
<line x1="431.7" y1="119" x2="431.7" y2="180" stroke="#3b6d8c" stroke-width="2" stroke-dasharray="5,4"/>
<text x="30" y="138" font-family="Arial,sans-serif" font-size="12">Week 4 rule baseline</text><rect x="290" y="125" width="242.0" height="18" rx="3" fill="#c98535"/><text x="542.0" y="139" font-family="Arial,sans-serif" font-size="12">0.550</text>
<text x="30" y="166" font-family="Arial,sans-serif" font-size="12">Logistic regression</text><rect x="290" y="153" width="242.0" height="18" rx="3" fill="#245848"/><text x="542.0" y="167" font-family="Arial,sans-serif" font-size="12">0.550</text>
<line x1="290" y1="184" x2="730" y2="184" stroke="#d9d8ce"/>
<text x="30" y="206" font-family="Arial,sans-serif" font-size="15" font-weight="700">Precision@50</text>
<line x1="431.7" y1="213" x2="431.7" y2="274" stroke="#3b6d8c" stroke-width="2" stroke-dasharray="5,4"/>
<text x="30" y="232" font-family="Arial,sans-serif" font-size="12">Week 4 rule baseline</text><rect x="290" y="219" width="202.4" height="18" rx="3" fill="#c98535"/><text x="502.4" y="233" font-family="Arial,sans-serif" font-size="12">0.460</text>
<text x="30" y="260" font-family="Arial,sans-serif" font-size="12">Logistic regression</text><rect x="290" y="247" width="211.2" height="18" rx="3" fill="#245848"/><text x="511.2" y="261" font-family="Arial,sans-serif" font-size="12">0.480</text>
<line x1="290" y1="278" x2="730" y2="278" stroke="#d9d8ce"/>
<text x="30" y="300" font-family="Arial,sans-serif" font-size="15" font-weight="700">ROC-AUC</text>
<text x="30" y="326" font-family="Arial,sans-serif" font-size="12">Week 4 rule baseline</text><rect x="290" y="313" width="251.5" height="18" rx="3" fill="#c98535"/><text x="551.5" y="327" font-family="Arial,sans-serif" font-size="12">0.572</text>
<text x="30" y="354" font-family="Arial,sans-serif" font-size="12">Logistic regression</text><rect x="290" y="341" width="337.4" height="18" rx="3" fill="#245848"/><text x="637.4" y="355" font-family="Arial,sans-serif" font-size="12">0.767</text>
<line x1="290" y1="372" x2="730" y2="372" stroke="#d9d8ce"/>
<text x="30" y="398" font-family="Arial,sans-serif" font-size="12">Dashed markers in precision rows = positive-class base rate</text>
</svg>
